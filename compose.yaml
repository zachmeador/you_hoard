services:
  youhoard:
    image: ghcr.io/zachmeador/you_hoard:main
    # build: .   # to build the image from this checkout instead
    restart: unless-stopped
    # Run as the user that owns your media files, so downloads, removals and
    # --organize can write there.
    user: "1000:1000"
    ports:
      - "8000:8000"
    environment:
      YTDLP_UPDATE_ON_START: "1"
      # UMASK: "002"   # keep new files group-writable, e.g. on a NAS share
      # YTDLP_COOKIE_FILE: /data/cookies.txt
    volumes:
      - ./data:/data
      # The archive. To import TubeArchivist in place, mount its media folder here.
      - /path/to/media:/media
    stop_grace_period: 30s
