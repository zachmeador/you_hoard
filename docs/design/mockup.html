<!doctype html>
<!--
  STRONGROOM: a visual identity for YouHoard

  An archive's strongroom is the locked room where the originals are kept: steel shelving, labelled
  boxes, and a few marked as irreplaceable. The idea lives in the visual language, not the vocabulary:
  near-monochrome surfaces, hairline rules, square corners and dense ledger-like tables, where color
  appears only when it carries a state or an action. One typeface does all the work, hierarchy comes
  from size, weight and color, and the words stay plain: archived, downloaded, not selected, gone from
  YouTube.

  Color system: Brass. One token set for dark (default) and light:
  - stone neutrals (hue 72), a brass accent (hue 82) with one job, and a five-hue state family at matched
    OKLCH lightness and chroma (L 0.745 / C 0.105 dark, L 0.50 / C 0.11 light) so the hues read as one
    family: progress 258, done 150, waiting 205, failed 27, gone from YouTube 328.
  - Contrast, checked with a script in both themes: body and muted text 4.5:1 or better on every
    surface, state colors used as text 4.5:1, glyphs and bars 3:1, accent fills against their label
    4.5:1, indicator lines against the background 3:1.
  Rules for where color may appear (enforced on every screen):
  1. Color carries state or action, nothing decorative. Everything else is neutral.
  2. The accent has one job: the primary action (Add, plus at most one commit button in the main area),
     focus rings, and where you are (current nav item, selected tab, segment or policy). Switches and
     checkboxes record settings and stay neutral.
  3. State hues appear as glyphs, progress bars, archive bars and alert callouts. Status words stay
     neutral beside their colored glyph; only failures color their text.
  4. Counts and numbers stay neutral, tab counts and "Failed 14" included, unless the number is the alert.
  5. Archived is the resting state and stays neutral in lists and bars; done marks completion events
     and healthy checks only.
  6. Large surfaces are never saturated: backgrounds, panels and cards are neutral, callout washes are
     7-10% tints, and the accent fills only small controls.
  7. Thumbnails are content: real ones are whatever YouTube serves, so the mockup's generated stand-ins
     use fixed colors of their own and never follow the theme. Tags drawn on images use the dark-theme
     state values in both themes.

  System, for the rebuild:
  - Type: Inter, variable (opsz 14-32, wght 100-900), self-hosted from @fontsource-variable/inter
    (opsz.css). It was drawn for screen UI at small sizes: tall x-height, open apertures, text spacing
    at 12-15px, an optical-size axis that tightens it on its own for 20-30px headings, true tabular
    figures and half-step weights. Monospace only for paths and IDs.
  - Scale (px): 12 uppercase labels, table headers, corner tags; 13 counts and legends; 13.5 secondary
    lines, hints, small buttons; 14 metadata, sidebar, controls, table figures; 15 body, table titles,
    inputs; 15.5 card titles; 17 date groups; 20 channel header; 26 page and video titles. Nothing
    under 12.
  - Weights: 400 text, 450 small muted text, 500 controls and table titles, 540 card titles, 600 labels,
    650 headings. Bold is for real emphasis only. Normal width throughout.
  - Default font smoothing (no -webkit-font-smoothing: antialiased), so macOS keeps its stem darkening
    and light text on dark stays solid.
  - Tokens: --bg/--bg-1/--bg-2/--bg-3 surfaces, --rule/--rule-2 lines, --ink..--ink-4 text (--ink-4 is
    decorative only), --acc/--acc-hi/--acc-line/--acc-ink, --prog/--done/--wait/--fail/--gone, derived
    --*-wash and --*-line tints, and --img-* for marks drawn on thumbnails.
  - Status glyphs: filled square = archived (neutral), hollow square = queued, hollow circle = waiting,
    progress hue = moving, failed hue = failed, dash = files removed, dotted = not selected,
    filled lozenge = archived and gone from YouTube, hollow lozenge = gone and never downloaded.
  - Thumbnail corners: top-left state, top-right type (Short/Stream), bottom-left quality,
    bottom-right duration, bottom edge progress or watched.
  - Page headers hold the title, actions and at most one figure shown nowhere else. No subtitles, and
    no helper text that repeats what the screen already shows.
-->
<html lang="en" data-theme="dark" data-dir="brass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>YouHoard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Cg fill='%23d6a84e'%3E%3Cpath d='M9 1l4.5 4.5h-9z'/%3E%3Cpath d='M3 7h12l2 2-2 2H3L1 9z'/%3E%3Cpath d='M4.5 12.5h9L9 17z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap">
<script>
  try {
    const t = localStorage.getItem('yh-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch {}
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  color-scheme:dark;
  --f-sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;

  --fs-label:12px; --fs-xs:13px; --fs-sm:13.5px; --fs-md:14px; --fs-base:15px; --fs-title:15.5px;
  --fs-h3:17px; --fs-h2:20px; --fs-h1:26px;
  --fw-text:400; --fw-small:450; --fw-ui:500; --fw-title:540; --fw-label:600; --fw-head:650;

  --hatch:repeating-linear-gradient(135deg,transparent 0 3px,rgba(255,255,255,.075) 3px 4px);
  --shadow:0 12px 32px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.4);
  --acc-wash:color-mix(in srgb,var(--acc-line) 15%,transparent);
  --fail-wash:color-mix(in srgb,var(--fail) 10%,transparent); --fail-line:color-mix(in srgb,var(--fail) 42%,transparent);
  --gone-wash:color-mix(in srgb,var(--gone) 10%,transparent); --gone-line:color-mix(in srgb,var(--gone) 42%,transparent);

  --ctl:30px; --r:2px; --side:248px; --gutter:24px; --stick:0px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --hatch:repeating-linear-gradient(135deg,transparent 0 3px,rgba(0,0,0,.09) 3px 4px);
  --shadow:0 12px 32px rgba(40,30,10,.16),0 0 0 1px rgba(0,0,0,.06);
  --acc-wash:color-mix(in srgb,var(--acc-line) 11%,transparent);
  --fail-wash:color-mix(in srgb,var(--fail) 7%,transparent); --fail-line:color-mix(in srgb,var(--fail) 38%,transparent);
  --gone-wash:color-mix(in srgb,var(--gone) 7%,transparent); --gone-line:color-mix(in srgb,var(--gone) 38%,transparent);
}

/* ---------- Brass color tokens; see the header comment for the rules ---------- */
:root[data-dir="brass"]{
  --bg:#110e0b; --bg-1:#161411; --bg-2:#1d1a17; --bg-3:#262320; --rule:#2d2925; --rule-2:#3c3934;
  --ink:#f0eae3; --ink-2:#c9c4bd; --ink-3:#a6a19b; --ink-4:#716c66;
  --acc:#e8b755; --acc-hi:#f6c463; --acc-line:#e8b755; --acc-ink:#1b150b;
  --prog:#83aeef; --done:#7abf89; --wait:#4abfcc; --fail:#e79288; --gone:#d194ce;
  --img-prog:#83aeef; --img-wait:#4abfcc; --img-fail:#e79288; --img-gone:#d194ce; --img-gone-ink:#15110b;
}
:root[data-dir="brass"][data-theme="light"]{
  --bg:#f8f4ef; --bg-1:#fefaf6; --bg-2:#eeeae6; --bg-3:#e5e1dd; --rule:#dfdad4; --rule-2:#cac5bf;
  --ink:#1f1b16; --ink-2:#46413c; --ink-3:#66615b; --ink-4:#a39d97;
  --acc:#915b10; --acc-hi:#804e03; --acc-line:#915b10; --acc-ink:#fffdfa;
  --prog:#3963a1; --done:#2b7440; --wait:#06717a; --fail:#984740; --gone:#844a83;
}



html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:64px}
body{background:var(--bg);color:var(--ink);font:var(--fw-text) var(--fs-base)/1.45 var(--f-sans);font-variant-numeric:tabular-nums;font-optical-sizing:auto;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;text-align:inherit}
img,svg{display:block}
ul,ol{list-style:none}
:focus-visible{outline:2px solid var(--acc-line);outline-offset:2px}
::selection{background:var(--acc);color:var(--acc-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- primitives ---------- */
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.label{font:var(--fw-label) var(--fs-label)/1.25 var(--f-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.mono{font-family:var(--f-mono);font-size:12.5px}
.lnk{color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:3px;text-decoration-thickness:1px}
.lnk:hover{text-decoration-color:var(--ink-3)}
.sep{color:var(--ink-4)}
kbd{font:500 12px/1 var(--f-mono);color:var(--ink-3);border:1px solid var(--rule-2);border-bottom-width:2px;padding:2px 5px;border-radius:2px}
.lz{display:inline-block;width:7px;height:7px;flex:none;background:currentColor;transform:rotate(45deg);margin:0 3px 0 1px}
.lz.hollow{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.nowrap{white-space:nowrap}
.prop{font-variant-numeric:proportional-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:var(--ctl);padding:0 11px;border:1px solid var(--rule-2);background:var(--bg-2);color:var(--ink);border-radius:var(--r);font:var(--fw-ui) var(--fs-md)/1 var(--f-sans);white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:var(--bg-3);border-color:var(--ink-4)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.btn.primary:hover{background:var(--acc-hi);border-color:var(--acc-hi)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--bg-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--fail)}
.btn.danger:hover{border-color:var(--fail-line);background:var(--fail-wash)}
.btn.sm{height:26px;padding:0 9px;font-size:var(--fs-sm)}
.btn.icon{width:var(--ctl);padding:0}
.btn.icon.sm{width:26px}
.btn[disabled]{opacity:.45;pointer-events:none}

.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:var(--r);background:var(--bg-1)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:calc(var(--ctl) - 2px);padding:0 10px;color:var(--ink-3);font-weight:var(--fw-ui);font-size:var(--fs-sm)}
.seg button+button{border-left:1px solid var(--rule-2)}
.seg button[aria-pressed="true"]{background:var(--bg-3);color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc-line)}
.seg button:hover{color:var(--ink)}

.sel{position:relative;display:inline-flex;align-items:center;height:var(--ctl);border:1px solid var(--rule-2);border-radius:var(--r);background:var(--bg-1);flex:none;max-width:100%}
.sel:hover{border-color:var(--ink-4)}
.sel>span{padding-left:10px;color:var(--ink-3);font-size:var(--fs-sm);white-space:nowrap}
.sel select{appearance:none;-webkit-appearance:none;background:transparent;border:0;height:100%;padding:0 28px 0 7px;font-weight:var(--fw-ui);font-size:var(--fs-md);color:var(--ink);cursor:pointer;min-width:0;max-width:240px;text-overflow:ellipsis}
.sel::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel select:focus-visible{outline:none}
.sel:focus-within{border-color:var(--ink-3)}
.sel.bare>span{display:none}
.sel.bare select{padding-left:10px}

.input{height:var(--ctl);width:100%;padding:0 10px;border:1px solid var(--rule-2);background:var(--bg);border-radius:var(--r);color:var(--ink);font-size:var(--fs-base)}
.input:focus{outline:none;border-color:var(--ink-3)}
.input::placeholder{color:var(--ink-3);opacity:.8}
.search{display:flex;align-items:center;gap:8px;height:var(--ctl);padding:0 7px 0 10px;border:1px solid var(--rule-2);background:var(--bg);border-radius:var(--r);color:var(--ink-3)}
.search:focus-within{border-color:var(--ink-3)}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font-size:var(--fs-base)}
.search input::placeholder{color:var(--ink-3);opacity:.8}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}

.sw{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:30px;height:17px;border:1px solid var(--rule-2);background:var(--bg-3);border-radius:2px;cursor:pointer;vertical-align:middle;transition:background .15s,border-color .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;background:var(--ink-3);border-radius:1px;transition:transform .15s,background .15s}
.sw:checked{background:var(--ink-2);border-color:var(--ink-2)}
.sw:checked::after{transform:translateX(13px);background:var(--bg)}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:var(--fs-md);color:var(--ink-2)}
.chk input{appearance:none;-webkit-appearance:none;width:15px;height:15px;border:1px solid var(--ink-4);border-radius:2px;background:var(--bg);display:grid;place-items:center;cursor:pointer}
.chk input:checked{background:var(--ink-2);border-color:var(--ink-2)}
.chk input:checked::after{content:"";width:7px;height:4px;border-left:1.5px solid var(--bg);border-bottom:1.5px solid var(--bg);transform:translateY(-1px) rotate(-45deg)}

.prog{position:relative;height:3px;background:var(--rule-2);overflow:hidden}
.prog>i{position:absolute;left:0;top:0;bottom:0;background:var(--prog);transition:width .9s linear}
.prog.ind>i{width:32%;animation:ind 1.5s cubic-bezier(.45,0,.55,1) infinite}
@keyframes ind{from{transform:translateX(-105%)}to{transform:translateX(320%)}}

/* status words: the glyph carries the state color, the words stay neutral (failures are the one exception) */
.st{--g:var(--ink-3);display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-md);font-weight:var(--fw-small);color:var(--ink-2);white-space:nowrap}
.st::before{content:"";flex:none;width:7px;height:7px;background:var(--g)}
.st.queued::before,.st.paused::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--g)}
.st.waiting,.st.upcoming{--g:var(--wait)} .st.waiting::before,.st.upcoming::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--g);border-radius:50%}
.st.downloading,.st.running,.st.checking{--g:var(--prog)}
.st.failed{--g:var(--fail);color:var(--fail)}
.st.deleted{color:var(--ink-3)} .st.deleted::before{height:0;border-top:1.5px solid var(--g);background:none}
.st.missing{color:var(--ink-3)} .st.missing::before{background:transparent;border:1.5px dashed var(--g);width:8px;height:8px}
.st.notsel,.st.upcoming,.st.cancelled{color:var(--ink-3)} .st.notsel::before,.st.cancelled::before{background:transparent;border:1px dotted var(--g);width:8px;height:8px}
.st.gone{--g:var(--gone)} .st.gone::before{transform:rotate(45deg);width:6px;height:6px;margin:0 1px}
.st.lost{color:var(--ink-3)} .st.lost::before{transform:rotate(45deg);width:6px;height:6px;margin:0 1px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--g)}
.st.completed,.st.ok{--g:var(--done)}
.lz.g{color:var(--gone)}

/* the archived bar: what a source contains */
.hbar{display:flex;gap:1px;height:6px;min-width:60px}
.hbar>i{display:block;min-width:2px;background:var(--ink-2)}
.hbar .g{background:var(--gone)} .hbar .q{background:var(--prog)} .hbar .f{background:var(--fail)}
.hbar .d{background:var(--ink-4)} .hbar .n{background:var(--bg-3);background-image:var(--hatch)}
.hbar.big{height:10px}
.pips{display:inline-flex;gap:2px;vertical-align:middle;margin-right:8px}
.pips i{width:5px;height:5px;box-shadow:inset 0 0 0 1px var(--ink-4)}
.pips i.on{background:var(--ink-2);box-shadow:none}

.avatar{display:grid;place-items:center;flex:none;width:30px;height:30px;background:var(--bg-3);color:var(--ink-2);font:600 12.5px/1 var(--f-sans);letter-spacing:.01em;border-radius:var(--r)}
.avatar.lg{width:42px;height:42px;font-size:15px}
.avatar.pl{background:var(--bg-2);box-shadow:inset 0 0 0 1px var(--rule-2);color:var(--ink-3)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg-1);border-right:1px solid var(--rule);display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent}
.main{min-width:0;padding:14px var(--gutter) 96px}
.topbar,.tabbar{display:none}

.side-add{display:flex;align-items:center;justify-content:center;gap:8px;margin:16px 16px 14px;height:38px;padding:0 14px;background:var(--acc);border-radius:var(--r);color:var(--acc-ink);font:600 var(--fs-md)/1 var(--f-sans)}
.side-add:hover{background:var(--acc-hi)}
.side-add .ic,.tb-acts .tb-add .ic{width:18px;height:18px;stroke-width:2}
.nav{display:flex;flex-direction:column;padding:2px 8px}
.nav a{position:relative;display:flex;align-items:center;gap:11px;height:34px;padding:0 8px;border-radius:var(--r);color:var(--ink-2);font-weight:var(--fw-ui);font-size:var(--fs-base)}
.nav a:hover{background:var(--bg-2);color:var(--ink)}
.nav a .ic{color:var(--ink-3)}
.nav a[aria-current="page"]{background:var(--bg-2);color:var(--ink)}
.nav a[aria-current="page"] .ic{color:var(--ink)}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:2px;background:var(--acc-line)}
.nav .n{margin-left:auto;color:var(--ink-3);font-size:var(--fs-xs);font-weight:var(--fw-small);display:inline-flex;align-items:center;gap:5px}
.nrun{display:inline-flex;align-items:center;gap:6px;color:var(--ink-3)}
.nrun::before{content:"";width:6px;height:6px;background:var(--prog)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--done);flex:none}
.dot.warn{background:var(--fail)}
.side-sec{padding:14px 8px 2px}
.side-h{display:flex;align-items:center;gap:7px;padding:0 8px 6px}
.side-h .count{color:var(--ink-3);font-size:var(--fs-xs)}
.side-h .seg{margin-left:auto}
.side-h .seg button{height:22px;padding:0 7px;font-size:12px}
.chan-filter{display:flex;align-items:center;gap:7px;margin:0 8px 6px;height:30px;padding:0 9px;border:1px solid var(--rule);background:var(--bg);border-radius:var(--r);color:var(--ink-3)}
.chan-filter:focus-within{border-color:var(--ink-4)}
.chan-filter input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:var(--fs-md);color:var(--ink)}
.chan-filter input::placeholder{color:var(--ink-3);opacity:.8}
.chan-list a{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;font-size:var(--fs-md);color:var(--ink-2);border-radius:var(--r)}
.chan-list a:hover{background:var(--bg-2);color:var(--ink)}
.chan-list a[aria-current="true"]{background:var(--bg-2);color:var(--ink);box-shadow:inset 2px 0 0 var(--acc-line)}
.chan-list .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chan-list .n{color:var(--ink-3);font-size:var(--fs-xs);font-weight:var(--fw-small)}
.chan-more{padding:6px 8px 4px;color:var(--ink-3);font-size:var(--fs-xs)}
.side-foot{margin-top:auto;padding:14px 16px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:10px;background:var(--bg-1);position:sticky;bottom:0}
.foot-row{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--ink-3)}
.foot-row .who{margin-right:auto;display:flex;align-items:center;gap:8px}

/* ---------- page furniture ---------- */
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;min-height:38px;margin:0 0 10px}
.ph h1{font:var(--fw-head) var(--fs-h1)/1.15 var(--f-sans);letter-spacing:-.02em;font-variant-numeric:proportional-nums}
.ph-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.crumbs{display:flex;gap:7px;align-items:center;font-size:var(--fs-sm);color:var(--ink-3);margin-bottom:10px;min-width:0}
.crumbs a:hover{color:var(--ink)}
.crumbs .cur{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:26px 0 8px}
.sec-h .label{color:var(--ink-2)}
.sec-h .n{color:var(--ink-3);font-size:var(--fs-sm)}
.sec-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .search{flex:1 1 260px;max-width:480px}
.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;flex-wrap:wrap;column-gap:22px;border-bottom:1px solid var(--rule)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;flex:none;display:inline-flex;align-items:center;padding:10px 0 9px;color:var(--ink-3);font-weight:var(--fw-ui);font-size:var(--fs-md);white-space:nowrap}
.tabs button b{margin-left:7px;font-weight:var(--fw-small);font-size:var(--fs-xs);color:var(--ink-3)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{color:var(--ink)}
.tabs button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--acc-line)}
.tabs .gone .lz{color:var(--gone);margin-right:7px}
.tabs .spacer{flex:1}
.resbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0 2px;color:var(--ink-3);font-size:var(--fs-sm);min-height:38px}
.resbar b{font-weight:var(--fw-ui);color:var(--ink-2)}
.token{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 4px 0 9px;border:1px solid var(--rule-2);border-radius:var(--r);color:var(--ink-2);font-size:var(--fs-sm)}
.token button{display:grid;place-items:center;width:18px;height:18px;color:var(--ink-3)}
.token button:hover{color:var(--ink)}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin:28px 0 0;color:var(--ink-3);font-size:var(--fs-sm)}
.pager b{color:var(--ink);font-weight:var(--fw-ui)}
.tfoot{padding:10px 0 0;color:var(--ink-3);font-size:var(--fs-sm)}
.empty{padding:48px 0;text-align:center;color:var(--ink-3);font-size:var(--fs-md)}
.empty b{display:block;font-size:18px;font-weight:var(--fw-label);color:var(--ink-2);margin-bottom:6px}

/* ---------- library ---------- */
.lib-bar{position:sticky;top:var(--stick);z-index:6;background:var(--bg);padding-top:4px;margin-top:-4px}
.lib-bar .toolbar{padding-bottom:8px}
.chband{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:10px 0 14px;margin-bottom:8px;border-bottom:1px solid var(--rule)}
.chband .who{display:flex;gap:12px;align-items:center;min-width:0;flex:1 1 280px}
.chband h2{font:var(--fw-head) var(--fs-h2)/1.2 var(--f-sans);letter-spacing:-.015em}
.chband .meta{margin-top:4px;color:var(--ink-3);font-size:var(--fs-sm);display:flex;flex-wrap:wrap;gap:4px 10px}
.chband .hold{display:flex;flex-direction:column;gap:7px;min-width:230px;flex:0 1 320px}
.chband .hold .row{display:flex;justify-content:space-between;gap:10px;font-size:var(--fs-sm);color:var(--ink-3)}
.chband .hold b{color:var(--ink);font-weight:var(--fw-ui)}
.chband .acts{display:flex;gap:6px;flex-wrap:wrap}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(208px,1fr));gap:20px 14px;padding-top:8px}
.grp{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;margin:12px 0 -6px}
.grp:first-child{margin-top:2px}
.grp h2{font:var(--fw-head) var(--fs-h3)/1.2 var(--f-sans);letter-spacing:-.012em;color:var(--ink)}
.grp::after{content:"";flex:1;border-top:1px solid var(--rule);transform:translateY(-5px)}
.tile{min-width:0;position:relative}
.thumb{position:relative;display:block;aspect-ratio:16/9;background:#17191b;overflow:hidden}
.thumb::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);pointer-events:none;z-index:3}
.plate{position:absolute;inset:0}
.plate>svg,.plate>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb.vert{background:#151719 repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,255,255,.035) 6px 7px)}
.thumb.vert .plate{left:50%;right:auto;width:auto;height:100%;aspect-ratio:9/16;transform:translateX(-50%)}
.tile .plate{transition:filter .15s,opacity .15s}
.tile:hover .plate{filter:brightness(1.1)}
.cn{position:absolute;z-index:4;display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 6px;background:rgba(12,12,12,.86);color:#eeebe4;font:600 12px/20px var(--f-sans);white-space:nowrap;max-width:calc(100% - 10px);overflow:hidden;text-overflow:ellipsis}
.cn .ic{width:12px;height:12px}
.cn.tl{top:5px;left:5px} .cn.tr{top:5px;right:5px} .cn.bl{bottom:7px;left:5px} .cn.br{bottom:7px;right:5px}
.cn.gone{background:var(--img-gone);color:var(--img-gone-ink)}
.cn.fail{color:var(--img-fail)}
.cn.prog{color:var(--img-prog)}
.cn.wait .ic{color:var(--img-wait)}
.cn.hollow{background:rgba(12,12,12,.76);box-shadow:inset 0 0 0 1px rgba(238,235,228,.42)}
.cn .lz{width:6px;height:6px}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.16);z-index:4;overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--img-prog);transition:width .9s linear}
.bar.seen{height:2px;background:transparent}
.bar.seen>i{width:100%;background:rgba(238,235,228,.72)}
.bar.ind>i{width:30%;animation:ind 1.5s cubic-bezier(.45,0,.55,1) infinite}
.t-title{margin-top:8px;font:var(--fw-title) var(--fs-title)/1.3 var(--f-sans);letter-spacing:-.006em;font-variant-numeric:proportional-nums;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.t-title a:hover{text-decoration:underline;text-decoration-color:var(--ink-4);text-underline-offset:3px;text-decoration-thickness:1px}
.t-meta{margin-top:3px;display:flex;gap:6px;align-items:center;color:var(--ink-3);font-size:var(--fs-md);white-space:nowrap;min-width:0}
.t-meta .ch{overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--ink-2)}
.t-meta .ch:hover{color:var(--ink)}
.t-meta .seen{display:inline-flex;align-items:center;margin-left:auto;color:var(--ink-3)}
.t-meta .seen .ic{width:13px;height:13px}
.t-err{margin-top:5px;padding-left:9px;border-left:2px solid var(--fail);color:var(--fail);font-size:var(--fs-sm);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-note{margin-top:4px;color:var(--ink-3);font-size:var(--fs-sm);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.is-watched .plate{opacity:.48}
.tile.is-watched .t-title{color:var(--ink-2)}
.tile.s-queued .plate,.tile.s-paused .plate{filter:saturate(.3) brightness(.8)}
.tile.s-missing .plate{filter:grayscale(1) brightness(.55)}
.tile.s-deleted .plate{filter:grayscale(1) brightness(.4)}
.tile.s-deleted .thumb::before{content:"";position:absolute;inset:0;z-index:2;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,255,255,.07) 6px 7px)}
.tile.s-deleted .t-title,.tile.s-missing .t-title{color:var(--ink-3)}
.tile.is-gone .thumb::after{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--img-gone) 70%,transparent)}

/* tables */
.tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.tbl th{position:sticky;top:var(--stick);z-index:3;background:var(--bg);text-align:left;font:var(--fw-label) var(--fs-label)/1 var(--f-sans);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:12px 10px 9px;border-bottom:1px solid var(--rule-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl th.num,.tbl td.num{text-align:right}
.tbl th button{display:inline-flex;align-items:center;gap:4px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
.tbl th button:hover{color:var(--ink)}
.tbl th[aria-sort]{color:var(--ink)}
.tbl th .ic{width:12px;height:12px}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--rule);vertical-align:middle;font-size:var(--fs-base)}
.tbl tbody tr:hover td{background:var(--bg-1)}
.tbl td.num{color:var(--ink-2);white-space:nowrap;font-size:var(--fs-md)}
.tbl td.dim{color:var(--ink-3);font-size:var(--fs-md)}
.tbl th:first-child,.tbl td:first-child{padding-left:0}
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.tbl .m-meta{display:none}
.ttl{font:var(--fw-ui) var(--fs-base)/1.3 var(--f-sans);font-variant-numeric:proportional-nums;color:var(--ink);overflow-wrap:anywhere}
a.ttl:hover{text-decoration:underline;text-decoration-color:var(--ink-4);text-underline-offset:3px;text-decoration-thickness:1px}
.ttl .lz{color:var(--gone);margin-right:7px;vertical-align:1px}
.mini{position:relative;display:block;width:68px;aspect-ratio:16/9;background:#17191b;overflow:hidden}
.mini.vert .plate{left:50%;right:auto;width:auto;height:100%;aspect-ratio:9/16;transform:translateX(-50%)}
.mini .bar{height:2px}
.row-err{margin-top:3px;color:var(--fail);font-size:var(--fs-sm);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-note{margin-top:3px;color:var(--ink-3);font-size:var(--fs-sm)}
.row-sub{margin-top:3px;display:flex;flex-wrap:wrap;align-items:center;gap:3px 9px;color:var(--ink-3);font-size:var(--fs-sm);min-width:0}
.row-sub a{color:var(--ink-2)} .row-sub a:hover{color:var(--ink)}
.gilt-note{color:var(--ink-3)}
.gilt-note .lz{color:var(--gone);margin-right:6px}
tr.is-watched .ttl{color:var(--ink-2)}
tr.s-deleted .ttl,tr.s-missing .ttl,tr.s-notsel .ttl{color:var(--ink-2)}
tr.lost .ttl{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-4)}
.mini-prog{display:inline-block;width:56px;vertical-align:middle;margin-left:9px}
.kindtag{display:inline-block;font:var(--fw-ui) 12px/18px var(--f-sans);color:var(--ink-3);border:1px solid var(--rule-2);padding:0 6px;border-radius:2px;white-space:nowrap}
.lib .c-th{width:82px} .lib .c-pub{width:112px} .lib .c-len{width:84px} .lib .c-st{width:202px} .lib .c-file{width:158px} .lib .c-arch{width:112px}
.lib .c-seen{width:36px;color:var(--ink-3)}
.lib .c-seen .ic{width:14px;height:14px}
.lib td.c-file .sep{margin:0 2px}

/* ---------- watch ---------- */
.watch{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;max-width:1720px}
.player{position:relative;background:#000;overflow:hidden;max-height:74vh;margin:0 auto;width:100%}
.player.vert{width:auto;height:min(74vh,760px);max-width:100%}
.player .plate{position:absolute;inset:0}
.player .scrim{position:absolute;inset:0;background:rgba(0,0,0,.18);z-index:1}
.player.unavail .scrim{background:rgba(8,8,8,.5)}
.player.unavail .plate{filter:saturate(.5)}
.big-play{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;display:grid;place-items:center;background:rgba(14,15,16,.8);border:1px solid rgba(255,255,255,.25);color:#f3f0ea;border-radius:2px;transition:background .15s}
.big-play:hover{background:rgba(14,15,16,.95)}
.big-play .ic{width:22px;height:22px}
.player.playing .big-play{opacity:0;pointer-events:none}
.pctl{position:absolute;z-index:3;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;background:rgba(8,8,8,.82);color:#eae7e0;font-size:var(--fs-xs)}
.pctl button{display:grid;place-items:center;height:30px;min-width:30px;color:#eae7e0}
.pctl .cc{padding:0 6px;border:1px solid rgba(255,255,255,.3);height:21px;font-weight:600;font-size:12px;white-space:nowrap}
.pctl .time{white-space:nowrap}
.scrub{position:relative;flex:1;height:14px;cursor:pointer;min-width:40px}
.scrub::before{content:"";position:absolute;left:0;right:0;top:5px;height:4px;background:rgba(255,255,255,.22)}
.scrub>i{position:absolute;left:0;top:5px;height:4px;background:#eeebe4}
.scrub>b{position:absolute;top:5px;width:2px;height:4px;background:rgba(8,8,8,.9)}
.pov{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:14px 16px;background:rgba(8,8,8,.86);color:#eeebe4;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.pov .what{font-weight:600;font-size:var(--fs-md);display:flex;align-items:center;gap:8px}
.pov .info{color:#c4c1ba;font-size:var(--fs-sm)}
.pov .prog{flex:1 1 100%;background:rgba(255,255,255,.2)}
.pov .prog>i{background:var(--img-prog)}
.w-title{font:var(--fw-head) var(--fs-h1)/1.2 var(--f-sans);letter-spacing:-.02em;margin:18px 0 12px;font-variant-numeric:proportional-nums;overflow-wrap:anywhere}
.w-by{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.w-by .who{display:flex;align-items:center;gap:10px;min-width:0}
.w-by .chn{font:600 var(--fs-base)/1.2 var(--f-sans)}
.w-by .chn:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--ink-4)}
.w-by .sub{margin-top:2px;font-size:var(--fs-sm);color:var(--ink-3)}
.w-stats{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--ink-3);font-size:var(--fs-md)}
.w-stats b{color:var(--ink-2);font-weight:var(--fw-ui)}
.w-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.w-acts .grow{flex:1}
.callout{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--rule-2);background:var(--bg-1);margin-top:14px;font-size:var(--fs-md);color:var(--ink-2);line-height:1.5}
.callout .ttl2{display:block;font-weight:var(--fw-label);color:var(--ink);font-size:var(--fs-base);margin-bottom:2px}
.callout q{quotes:"“" "”";color:var(--ink)}
.callout.gone{border-color:var(--gone-line);background:var(--gone-wash)}
.callout.gone .mk{color:var(--gone)}
.callout.fail{border-color:var(--fail-line);background:var(--fail-wash)}
.callout.fail .ttl2,.callout.fail .mk{color:var(--fail)}
.callout .mk{flex:none;margin-top:5px}
.callout .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.desc{margin-top:16px;max-width:76ch}
.desc-text{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-2);font-size:var(--fs-base);line-height:1.6}
.desc.collapsed .desc-text{max-height:9.6em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.desc-text a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:3px}
.desc-text .ts{color:var(--ink);font-weight:var(--fw-label);text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:3px}
.more-btn{margin-top:6px;color:var(--ink-2);font-weight:var(--fw-ui);font-size:var(--fs-sm)}
.more-btn:hover{color:var(--ink)}
.record{border-left:1px solid var(--rule);padding-left:24px;min-width:0}
.record h2{margin:0 0 10px}
.record section+section{margin-top:24px}
.kv{display:grid;grid-template-columns:100px minmax(0,1fr);gap:8px 12px;font-size:var(--fs-md)}
.kv dt{color:var(--ink-3);font-size:var(--fs-sm)}
.kv dd{color:var(--ink);min-width:0;overflow-wrap:anywhere}
.kv dd .copy{margin-left:4px;color:var(--ink-3);vertical-align:-3px}
.kv dd .copy:hover{color:var(--ink)}
.tree{font:12.5px/1.65 var(--f-mono);color:var(--ink-2);overflow-wrap:anywhere}
.tree li{display:flex;gap:8px;align-items:baseline;padding-left:14px;position:relative}
.tree li::before{content:"";position:absolute;left:3px;top:0;bottom:0;border-left:1px solid var(--rule-2)}
.tree li:last-child::before{bottom:auto;height:.8em}
.tree li::after{content:"";position:absolute;left:3px;top:.8em;width:7px;border-top:1px solid var(--rule-2)}
.tree .root{padding-left:0;color:var(--ink-3)}
.tree .root::before,.tree .root::after{display:none}
.tree .dir{color:var(--ink)}
.tree .f{flex:1;min-width:0}
.tree .sz{color:var(--ink-3);white-space:nowrap}
.tree .media .f{color:var(--ink)}
.subs-list li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--rule);font-size:var(--fs-md)}
.subs-list li:last-child{border-bottom:0}
.subs-list .lang{color:var(--ink-3);font-size:12.5px;font-family:var(--f-mono);margin-left:6px}
.note{margin-top:8px;color:var(--ink-3);font-size:var(--fs-sm);line-height:1.45}
.morelist li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--rule)}
.morelist .mini{width:120px}
.morelist .ttl{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.morelist .meta{margin-top:3px;color:var(--ink-3);font-size:var(--fs-sm)}

/* ---------- subscriptions ---------- */
.subs .c-pol{width:140px} .subs .c-hold{width:252px} .subs .c-last{width:300px} .subs .c-next{width:110px} .subs .c-on{width:60px} .subs .c-act{width:90px}
.src{display:flex;gap:11px;align-items:center;min-width:0}
.src .ttl{font-size:var(--fs-title)}
.src .k{margin-top:2px;color:var(--ink-3);font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subs td.c-pol{color:var(--ink-2);font-size:var(--fs-md);white-space:nowrap}
.pol-inline,.next-inline{display:none}
.pol-inline{color:var(--ink-2)}
.next-inline{margin-top:2px;color:var(--ink-3);font-size:var(--fs-sm)}
.hold-cell .nums{margin-top:6px;display:flex;flex-wrap:wrap;gap:2px 11px;font-size:var(--fs-sm);color:var(--ink-3)}
.hold-cell .nums b{color:var(--ink);font-weight:var(--fw-ui)}
.hold-cell .nums span{display:inline-flex;align-items:center;gap:5px}
.hold-cell .nums .q::before,.hold-cell .nums .f::before,.hold-cell .nums .g::before{content:"";width:7px;height:7px}
.hold-cell .nums .q::before{background:var(--prog)} .hold-cell .nums .f::before{background:var(--fail)} .hold-cell .nums .g::before{background:var(--gone)}
.lc{font-size:var(--fs-sm);color:var(--ink-2);display:flex;flex-direction:column;gap:2px;min-width:0}
.lc .when{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.lc .when .ic{width:13px;height:13px;color:var(--ink-3)}
.lc .sum{color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc.fail .when,.lc.fail .sum,.lc.fail .when .ic{color:var(--fail)}
.lc.run .when .ic{color:var(--prog)}
.lc .prog{width:120px;margin-top:4px}
.subs .c-on{text-align:center}
.subs .c-act{text-align:right;white-space:nowrap}
.subs tr.off .ttl,.subs tr.off .hold-cell{opacity:.6}
.menu-wrap{position:relative;display:inline-block}
.menu{position:absolute;right:0;top:calc(100% + 4px);z-index:30;min-width:190px;padding:4px;background:var(--bg-2);border:1px solid var(--rule-2);box-shadow:var(--shadow);display:none;text-align:left}
.menu.open{display:block}
.menu button,.menu a{display:flex;width:100%;align-items:center;gap:9px;height:32px;padding:0 9px;font-size:var(--fs-md);color:var(--ink-2);border-radius:var(--r);white-space:nowrap}
.menu button:hover,.menu a:hover{background:var(--bg-3);color:var(--ink)}
.menu button.danger{color:var(--fail)}
.menu hr{border:0;border-top:1px solid var(--rule-2);margin:4px 0}

/* subscription detail */
.sd-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px 24px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.sd-head .who{display:flex;gap:14px;align-items:center;min-width:0;flex:1 1 420px}
.sd-head h1{font:var(--fw-head) var(--fs-h1)/1.15 var(--f-sans);letter-spacing:-.02em;font-variant-numeric:proportional-nums}
.sd-head .meta{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--ink-3);font-size:var(--fs-sm)}
.sd-head .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:0 1 auto;min-width:0}
.sd-head .enabled{display:inline-flex;gap:8px;align-items:center;margin-right:6px;font-size:var(--fs-md);color:var(--ink-2)}
.sd-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0 32px;border-bottom:1px solid var(--rule)}
.sd-grid>section{padding:16px 0 18px}
.sd-grid>section+section{border-left:1px solid var(--rule);padding-left:32px}
.pseg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--rule-2);border-radius:var(--r);margin-top:10px}
.pseg button{display:flex;align-items:center;height:38px;padding:0 12px;color:var(--ink-2);min-width:0;font-weight:var(--fw-ui);font-size:var(--fs-md);white-space:nowrap}
.pseg button+button{border-left:1px solid var(--rule-2)}
.pseg button:hover{background:var(--bg-2)}
.pseg button[aria-pressed="true"]{background:var(--acc-wash);color:var(--ink);box-shadow:inset 0 0 0 1px var(--acc-line)}
.pol-detail{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;margin-top:12px;font-size:var(--fs-md);color:var(--ink-2)}

.tab-group{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.ovr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;margin-top:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>.label{color:var(--ink-3)}
.field .sel{width:100%}
.field .sel select{width:100%;max-width:none}
.field .hint{color:var(--ink-3);font-size:var(--fs-sm);line-height:1.35}
.savebar{display:none;align-items:center;gap:8px;margin-top:14px;padding:8px 10px;border:1px solid var(--rule-2);background:var(--bg-1)}
.savebar.on{display:flex}
.savebar span{margin-right:auto;color:var(--ink-2);font-size:var(--fs-md)}
.chk-block{display:grid;grid-template-columns:104px minmax(0,1fr);gap:9px 12px;font-size:var(--fs-md);margin-top:10px}

.legend{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:9px;font-size:var(--fs-xs);color:var(--ink-3)}

.legend .g{background:var(--gone)} .legend .q{background:var(--prog)} .legend .f{background:var(--fail)} .legend .d{background:var(--ink-4)} .legend .n{background:var(--bg-3);background-image:var(--hatch);box-shadow:inset 0 0 0 1px var(--rule-2)}

/* ---------- queue ---------- */
.qsum{display:grid;grid-template-columns:auto auto 1fr;gap:16px 40px;align-items:end;padding:2px 0 16px;border-bottom:1px solid var(--rule)}

.run.check .glyph{width:132px;aspect-ratio:16/9;display:grid;place-items:center;background:var(--bg-1);box-shadow:inset 0 0 0 1px var(--rule-2);color:var(--ink-3)}

.q .c-when b{display:block;color:var(--ink);font-weight:var(--fw-ui);font-size:var(--fs-base)}
.q .c-when span{color:var(--ink-3);font-size:var(--fs-sm)}
.q .c-when.wt b{display:flex;align-items:center;gap:8px}
.q .c-when.wt b::before{content:"";width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--wait)}
.q .c-when.wt span{padding-left:15px}
.q .c-added{width:104px} .q .c-tries{width:72px} .q .c-fin{width:112px} .q .c-res{width:280px} .q .c-took{width:80px}

/* ---------- system ---------- */
.sys{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0 40px;align-items:start}

.health .v{min-width:0;overflow-wrap:anywhere}
.health .v small{display:block;color:var(--ink-3);font-size:var(--fs-sm);margin-top:1px}

.disk-big .hbar{height:14px}

.bars .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}

.bars .b{height:8px;background:var(--bg-2)}
.bars .b i{display:block;height:100%;background:var(--ink-3)}
.bars .v{text-align:right;color:var(--ink-2)}
.cmd{display:flex;gap:8px;align-items:flex-start}

/* ---------- dialog, toast ---------- */
dialog{margin:auto;border:1px solid var(--rule-2);background:var(--bg-1);color:var(--ink);width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 48px);box-shadow:var(--shadow);padding:0}
dialog::backdrop{background:rgba(5,5,6,.66)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--rule)}
.dlg-h h2{font:var(--fw-head) 19px/1.2 var(--f-sans);letter-spacing:-.012em}
.dlg-b{padding:16px}
.url-row{display:flex;gap:8px}
.url-row .input{flex:1}
.hint{margin-top:8px;color:var(--ink-3);font-size:var(--fs-sm);line-height:1.5}
.ex{color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:3px;font-size:var(--fs-sm)}
.ex:hover{color:var(--ink)}
.res{margin-top:16px;border-top:1px solid var(--rule);padding-top:16px}
.res .who{display:flex;gap:12px;align-items:center}
.res .ttl{font-size:17px;font-weight:var(--fw-label)}
.res .k{color:var(--ink-3);font-size:var(--fs-sm);margin-top:3px}
.res .known{margin-top:12px;padding:9px 11px;background:var(--bg-2);font-size:var(--fs-md);color:var(--ink-2)}
.res .row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:12px}
.res .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(520px,calc(100vw - 24px))}
.toast{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--ink);color:var(--bg);font-size:var(--fs-md);font-weight:var(--fw-ui);box-shadow:var(--shadow);animation:tin .18s ease-out;max-width:100%}

/* ---------- responsive ---------- */
@media (max-width:1599px){

}

}

}
@media (max-width:1279px){

}

@media (max-width:1179px){

  .topnav{display:flex;gap:2px;margin-left:-10px}
  .topnav a{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;color:var(--ink-2);font-weight:var(--fw-ui);font-size:var(--fs-md);border-radius:var(--r)}
  .topnav a:hover{color:var(--ink);background:var(--bg-2)}
  .topnav a[aria-current="page"]{color:var(--ink);background:var(--bg-2);box-shadow:inset 0 -2px 0 var(--acc-line)}
  .topnav .n{display:inline-flex;align-items:center;gap:5px;color:var(--ink-3);font-size:var(--fs-xs);font-weight:var(--fw-small)}
  .topnav .n:not(:empty)::before{content:"";width:6px;height:6px;background:var(--prog)}
  .tb-acts{margin-left:auto;display:flex;gap:2px}
  .tb-acts button{width:36px;height:36px;display:grid;place-items:center;color:var(--ink-2);border-radius:var(--r)}

  .tb-acts .tb-add{width:auto;display:inline-flex;align-items:center;gap:6px;height:34px;margin-left:8px;padding:0 14px 0 11px;background:var(--acc);color:var(--acc-ink);font:600 var(--fs-md)/1 var(--f-sans)}
  .tb-acts .tb-add:hover{background:var(--acc-hi);color:var(--acc-ink)}
  .main{padding:14px var(--gutter) 96px}
  .watch{grid-template-columns:minmax(0,1fr)}
  .record{border-left:0;padding-left:0;border-top:1px solid var(--rule);padding-top:20px}
  .sys{display:flex;flex-direction:column}
  .sys>div:nth-child(2){order:-1}
  .sys>div:first-child>section:first-child{border-top:1px solid var(--rule);padding-top:16px}
  .sd-grid{grid-template-columns:minmax(0,1fr)}
  .sd-grid>section+section{border-left:0;padding-left:0;border-top:1px solid var(--rule)}
}
@media (max-width:1023px){
  .q .c-ch{display:none}
}
@media (max-width:899px){
  .lib-bar{position:static}
  /* tables collapse to stacked rows */

  .tbl.stack,.tbl.stack tbody{display:block}

}
@media (max-width:760px){
  .run{grid-template-columns:100px minmax(0,1fr)}

  .qsum .bulk{grid-column:1/-1;justify-self:start}
  .pseg{grid-template-columns:repeat(2,minmax(0,1fr))}

  .ovr,.form-grid{grid-template-columns:minmax(0,1fr)}
  .ledger{grid-template-columns:repeat(2,minmax(0,1fr))}

}
@media (max-width:639px){

  .tabbar a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:56px;color:var(--ink-3);font-size:12px;font-weight:var(--fw-ui)}
  .tabbar a .ic{width:19px;height:19px}
  .tabbar a[aria-current="page"]{color:var(--ink)}

  .tabbar .badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:16px;padding:0 4px;background:var(--bg-3);color:var(--ink);box-shadow:inset 0 -2px 0 var(--prog);font-size:12px;font-weight:600;line-height:16px;text-align:center;border-radius:2px}

  .ph h1{font-size:23px}

  .t-title{font-size:var(--fs-base)}

  .sd-head h1{font-size:23px}
  .disk-big .nums b{font-size:18px}
  .bars li{grid-template-columns:minmax(0,120px) minmax(0,1fr) 62px}
  .toasts{bottom:calc(70px + env(safe-area-inset-bottom))}
  .chband .hold{flex-basis:100%}
  .btn{height:34px}

}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}
}

<div class="app">
  <aside class="side" id="side" aria-label="Sidebar"></aside>
  <header class="topbar" id="topbar"></header>
  <main class="main" id="main" tabindex="-1"></main>

</div>

<dialog id="add-dlg" aria-labelledby="add-title"></dialog>

<script>
(() => {
'use strict';

const $ = (s, el = document) => el.querySelector(s);

/* ================================================================== time and formatting */
const NOW = new Date(2026, 9, 24, 18, 40, 0);
const T0 = Date.now();
const now = () => new Date(NOW.getTime() + (Date.now() - T0));
const MIN = 60000;
const at = (m) => new Date(NOW.getTime() + m * MIN);
const day = (y, mo, d, h = 0, mi = 0) => new Date(y, mo - 1, d, h, mi);
const pad = (n) => String(n).padStart(2, '0');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    <div style="display:flex;gap:6px;margin-top:10px"><button class="btn sm" data-act="toast" data-msg="Path copied">${ic('copy')}Copy path</button><a class="btn sm quiet" href="#/video/${v.id}" data-act="toast" data-msg="Would download the .info.json">${ic('dl')}.info.json</a></div>

  return `

/* ================================================================== subscriptions */
function lastCheck(s) {
  if (s.checking) return `<div class="lc run"><span class="when">${ic('refresh')}Checking now…</span><div class="prog ind"><i></i></div></div>`;
  const l = s.last;
  if (!l) return `<div class="lc"><span class="when">Never checked</span></div>`;
  if (l.status === 'failed') return `<div class="lc fail"><span class="when">${ic('x')}Failed ${rel(l.at)}</span><span class="sum" title="${esc(l.err)}">${esc(l.err)}</span></div>`;
  const r = l.r;
  return `<div class="lc"><span class="when">${ic('check')}${rel(l.at)}</span><span class="sum">${int(r.listed)} listed · ${int(r.new)} new · ${int(r.queued)} queued${r.removed ? ` · ${int(r.removed)} removed` : ''}${r.full ? ' (full)' : ''}</span></div>`;
}
const nextCheck = (s) => (!s.enabled ? '<span class="muted">Paused</span>' : s.checking ? '<span class="muted">—</span>' : s.next ? `<span title="${isoTime(s.next)}">${rel(s.next)}</span>` : '—');
function holdCell(s) {
  const c = s.counts;
  return `<div class="hold-cell">${holdBar(c)}<div class="nums"><span><b>${int(c.archived)}</b> / ${int(c.entries)}</span>${c.queued ? `<span class="q"><b>${int(c.queued)}</b> queued</span>` : ''}${c.failed ? `<span class="f"><b>${int(c.failed)}</b> failed</span>` : ''}${c.not_selected ? `<span><b>${int(c.not_selected)}</b> not selected</span>` : ''}${c.removed ? `<span class="g"><b>${int(c.removed)}</b> removed</span>` : ''}</div></div>`;
}
function srcMeta(s) {
  const bits = [s.kind === 'playlist' ? `Playlist · by ${esc(s.owner)}` : `Channel${CH[s.ch]?.handle ? ` · ${esc(CH[s.ch].handle)}` : ''}`];
  if (s.kind === 'channel') bits.push(s.types.map((t) => TYPE_TABS[t]).join(', '));
  if (s.quality) bits.push(s.quality);
  bits.push(interval(s.every));
  return bits.join(' · ');
}
function subsList() {
  const f = state.subs;
  let list = SUBS.filter((s) => {
    if (f.q && !s.title.toLowerCase().includes(f.q.toLowerCase())) return false;
    if (f.kind && s.kind !== f.kind) return false;
    if (f.policy && s.policy !== f.policy) return false;
    if (f.state === 'on' && !s.enabled) return false;
    if (f.state === 'off' && s.enabled) return false;
    if (f.state === 'problems' && !(s.counts.failed || s.last?.status === 'failed')) return false;
    return true;
  });
  return list.sort((a, b) => a.title.localeCompare(b.title, 'en', { sensitivity: 'base' }));
}
function viewSubs() {
  const nextUp = SUBS.filter((s) => s.enabled && s.next && !s.checking).sort((a, b) => a.next - b.next)[0];
  const f = state.subs;
  return `
    <header class="ph">
      <h1>Subscriptions</h1>
      <div class="ph-r"><button class="btn" data-act="add">${ic('plus')}Add subscription</button></div>
    </header>
    <div class="toolbar" style="padding-bottom:10px">

        ${sel('substate', 'State', [['', `Any (${SUBS_TOTAL})`], ['on', 'Enabled (39)'], ['off', 'Paused (2)'], ['problems', `Has problems (${SUBS.filter((x) => x.counts.failed || x.last?.status === 'failed').length})`]], f.state)}

}
function subsTable() {

function invTable(s, inv) {
  const f = state.inv, q = f.q.trim().toLowerCase();
  const rows = inv.filter((e) => {
    if (q && !`${e.t} ${e.id}`.toLowerCase().includes(q)) return false;
    if (f.type && e.type !== f.type) return false;
    if (f.status === 'removed') return !!e.removed;
    if (f.status === 'queued') return ['queued', 'waiting', 'downloading', 'paused'].includes(e.st);
    if (f.status === 'notsel') return e.st === 'notsel' || e.st === 'upcoming';
    if (f.status) return e.st === f.status;
    return true;
  });
  if (!rows.length) return `<div class="empty"><b>No matches</b>No entries match these filters.</div>`;
  const entryState = (e) => {
    const lost = e.removed && !['archived', 'deleted'].includes(e.st);
    if (e.st === 'upcoming') return `<span class="st upcoming">Premieres ${whenShort(e.prem)}</span>`;
    if (lost) return `<span class="st lost">Never downloaded</span>`;
    if (e.st === 'notsel') return `<span class="st notsel">Not selected</span>`;
    if (e.v) return stWord(e.v, { bar: true });
    return { archived: '<span class="st archived">Archived</span>', deleted: '<span class="st deleted">Files removed</span>', failed: '<span class="st failed">Failed</span>' }[e.st] || `<span class="st">${esc(e.st)}</span>`;
  };
  const action = (e) => {
    const lost = e.removed && !['archived', 'deleted'].includes(e.st);
    if (lost) return '';
    if (e.st === 'notsel' || e.st === 'missing') return `<button class="btn sm" data-act="dlentry" data-id="${e.id}">${ic('dl')}Download</button>`;
    if (e.st === 'failed') return `<button class="btn sm" data-act="retry" data-id="${e.id}">${ic('retry')}Retry</button>`;
    if (e.st === 'deleted') return `<button class="btn sm quiet" data-act="dlentry" data-id="${e.id}">${ic('dl')}Again</button>`;
    return '';
  };
  return `<table class="tbl inv stack">
    <thead><tr><th class="c-pos num">#</th><th>Title</th><th class="c-kind">Type</th><th class="num c-len">Length</th><th class="num c-seen">First seen</th><th class="c-st">Status</th><th class="c-act"><span class="sr">Actions</span></th></tr></thead>
    <tbody>${rows.map((e) => {
      const lost = e.removed && !['archived', 'deleted'].includes(e.st);
      const held = e.removed && !lost;
      const title = e.v ? `<a class="ttl" href="#/video/${e.id}">${held ? '<i class="lz"></i>' : ''}${esc(e.t)}</a>` : `<span class="ttl">${esc(e.t)}</span>`;
      return `<tr class="s-${e.st}${lost ? ' lost' : ''}">
        <td class="c-pos num">${e.pos}</td>
        <td class="c-main keep">${title}
          ${held ? `<div class="row-note"><i class="lz g"></i> Removed from source ${dmy(e.removed)} · archived</div>` : ''}
          ${lost ? `<div class="row-note">Removed from source ${dmy(e.removed)}</div>` : ''}
          ${e.st === 'failed' && e.v ? `<div class="row-err">${esc(e.v.err)}</div>` : ''}
          <div class="m-meta">#${e.pos} · ${e.type === 'short' ? 'Short' : e.type === 'live' ? 'Stream' : 'Video'}${e.dur ? ` · ${dur(e.dur)}` : ''} · seen ${iso(e.seen)}<br>${entryState(e)}</div></td>
        <td class="c-kind">${e.live === 'is_upcoming' ? 'Premiere' : e.type === 'short' ? 'Short' : e.type === 'live' ? 'Stream' : 'Video'}</td>
        <td class="num c-len">${e.dur ? dur(e.dur) : '—'}</td>
        <td class="num c-seen">${iso(e.seen)}</td>
        <td class="c-st">${entryState(e)}</td>
        <td class="c-act c-side keep">${action(e)}<a class="ext" href="https://www.youtube.com/watch?v=${e.id}" target="_blank" rel="noopener noreferrer" aria-label="Open on YouTube">${ic('ext')}</a></td>
      </tr>`;
    }).join('')}
    </tbody></table>
    ${s.key === 'tc' && !f.status && !f.q && !f.type ? `<nav class="pager" aria-label="Inventory pages"><button class="btn sm" disabled>${ic('left')}Previous</button><span>Page <b>1</b> of 11</span><button class="btn sm" data-act="toast" data-msg="Page 2: entries 25–48">Next${ic('right')}</button></nav>` : ''}`;
}

      <table class="tbl q stack"><thead><tr><th class="c-when">Until</th><th>Video</th><th class="c-ch">Channel</th><th class="c-src">Source</th><th class="c-act"><span class="sr">Actions</span></th></tr></thead><tbody>

/* ================================================================== render + events */
let lastRoute = '';
function render(keepScroll = false) {
  const r = route();
  const key = JSON.stringify(r);
  const y = window.scrollY;
  const main = $('#main');
  if (r.name === 'library') main.innerHTML = viewLibrary();
  else if (r.name === 'video') main.innerHTML = viewVideo(r.id);
  else if (r.name === 'subs') main.innerHTML = viewSubs();
  else if (r.name === 'sub') main.innerHTML = viewSub(r.id);
  else if (r.name === 'queue') main.innerHTML = viewQueue();
  else main.innerHTML = viewSystem();
  const titles = { library: 'Library', video: r.id ? VBY[r.id]?.t : '', subs: 'Subscriptions', sub: r.id ? SBY[r.id]?.title : '', queue: 'Queue', system: 'System' };
  document.title = `${titles[r.name] || 'Library'} · YouHoard`;
  if (key !== lastRoute) {
    renderSide();
    renderTop();
    if (!keepScroll) window.scrollTo(0, 0);
    lastRoute = key;
  } else if (keepScroll) window.scrollTo(0, y);
}
function rerenderLib() {
  const el = $('#lib-results');
  if (!el) return render(true);
  el.innerHTML = libResults();
  const fac = $('#facets');
  if (fac) fac.innerHTML = facetButtons();
}
function setLib(patch, nav = true) {
  Object.assign(state.lib, patch);
  if (route().name !== 'library') { location.hash = '#/library'; return }
  render(true);
  renderSide();
  if (nav) window.scrollTo(0, 0);
}
function toast(msg, gilt = false) {
  const box = $('#toasts');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `${gilt ? '<i class="lz"></i>' : ''}<span>${esc(msg)}</span>`;
  box.appendChild(t);
  setTimeout(() => t.remove(), 3200);
  while (box.children.length > 3) box.firstChild.remove();
}
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  store.set('theme', t);
  renderSide();
  renderTop();
}
function closeMenus(except) {
  document.querySelectorAll('.menu.open').forEach((m) => { if (m !== except) { m.classList.remove('open'); m.previousElementSibling?.setAttribute('aria-expanded', 'false') } });
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!e.target.closest('.menu-wrap')) closeMenus();
  if (!t) return;
  const act = t.dataset.act;
  const v = t.dataset.v;
  switch (act) {
    case 'view': state.lib.view = v; store.set('view', v); document.querySelectorAll('[data-act="view"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v))); rerenderLib(); break;
    case 'facet': state.lib.status = v; state.lib.shelf = ''; rerenderLib(); renderSide(); break;
    case 'order': state.lib.order = state.lib.order === 'desc' ? 'asc' : 'desc'; t.innerHTML = ic(state.lib.order === 'desc' ? 'down' : 'up'); t.setAttribute('aria-label', state.lib.order === 'desc' ? 'Descending; switch to ascending' : 'Ascending; switch to descending'); rerenderLib(); break;
    case 'sortcol': if (state.lib.sort === v) state.lib.order = state.lib.order === 'desc' ? 'asc' : 'desc'; else { state.lib.sort = v; state.lib.order = v === 'title' ? 'asc' : 'desc' } render(true); break;
    case 'chan': e.preventDefault(); setLib({ channel: t.dataset.ch, shelf: '' }); break;
    case 'clearchan': setLib({ channel: '' }, false); break;
    case 'shelf': {
      e.preventDefault();
      const base = { q: '', type: '', watched: '', channel: '', status: '', sort: 'published', order: 'desc', shelf: v };
      if (v === 'recent') Object.assign(base, { status: 'archived', sort: 'archived' });
      if (v === 'unwatched') base.watched = 'false';
      if (v === 'gone') base.status = 'gone';
      if (v === 'failed') base.status = 'failed';
      setLib(base);
      break;
    }
    case 'untoken': { const k = t.dataset.k; state.lib[k] = ''; if (k === 'q') { const q = $('#q'); if (q) q.value = '' } if (k === 'channel') return setLib({ channel: '' }, false); render(true); break }
    case 'reset': setLib({ q: '', type: '', watched: '', channel: '', status: '', shelf: '' }, false); break;
    case 'chansort': state.chanSort = v; renderSide(); break;
    case 'theme': setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'); break;
    case 'search': if (route().name !== 'library') location.hash = '#/library'; setTimeout(() => $('#q')?.focus(), 50); break;
    case 'add': openAdd(); break;
    case 'closeadd': $('#add-dlg').close(); break;
    case 'resolve': resolveAdd(); break;
    case 'ex': $('#add-url').value = t.dataset.u; resolveAdd(); break;
    case 'addpol': t.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === t))); break;
    case 'subscribe': $('#add-dlg').close(); toast('Subscribed to Cathode Ray Dude. First check queued.'); break;
    case 'addvideo': $('#add-dlg').close(); toast('Added “Booting a PDP-11/40 from paper tape”. Download queued.'); break;
    case 'toast': e.preventDefault(); toast(t.dataset.msg); break;
    case 'watched': { const vid = VBY[t.dataset.id]; vid.watched = vid.watched ? null : now(); toast(vid.watched ? 'Marked watched' : 'Marked unwatched'); render(true); break }
    case 'remove': toast('Mockup: this asks for confirmation, then deletes the media and sidecars'); break;
    case 'retry': toast('Download queued'); break;
    case 'dlentry': { const row = t.closest('tr'); t.outerHTML = '<span class="st queued">Queued</span>'; if (row) row.querySelector('.c-st').innerHTML = '<span class="st queued">Queued</span>'; toast('Queued for download'); break }
    case 'desc': state.descOpen = !state.descOpen; render(true); break;
    case 'play': state.player.playing = !state.player.playing; updatePlayer(); break;
    case 'seek': { const p = $('#player'); if (p) { state.player.t = Number(t.dataset.t); state.player.playing = true; updatePlayer(); p.scrollIntoView({ block: 'nearest', behavior: 'smooth' }) } break }
    case 'scrub': { const r = t.getBoundingClientRect(); const vid = VBY[state.player.id]; state.player.t = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * vid.dur; updatePlayer(); break }
    case 'menu': { const m = t.nextElementSibling; const open = !m.classList.contains('open'); closeMenus(m); m.classList.toggle('open', open); t.setAttribute('aria-expanded', String(open)); break }
    case 'subtoggle': { const s = SBY[t.dataset.k]; s.enabled = t.checked; toast(s.enabled ? `Enabled “${s.title}”` : `Paused “${s.title}”`); render(true); break }
    case 'policy': state.edit.policy = v; state.edit.dirty = true; render(true); break;
    case 'tab': { const set = new Set(state.edit.types); t.checked ? set.add(v) : set.delete(v); state.edit.types = [...set]; markDirty(); break }
    case 'discard': state.edit = null; render(true); break;
    case 'savesub': { const s = SBY[state.edit.key]; Object.assign(s, { policy: state.edit.policy, n: state.edit.n, types: state.edit.types, every: Number(state.edit.every) }); state.edit = null; toast('Subscription saved'); render(true); break }
    case 'invf': state.inv.status = v; render(true); break;
    case 'qtab': state.queue.tab = v; render(true); break;
    case 'conc': { SETTINGS.conc = Math.max(1, Math.min(8, SETTINGS.conc + Number(v))); $('#conc').textContent = SETTINGS.conc; settingsDirty(); break }
    case 's-comments': SETTINGS.comments = t.checked; settingsDirty(); break;
    case 'savesettings': saved = { ...SETTINGS }; settingsDirty(); toast('Settings saved'); startNext(); break;
  }
});
function markDirty() { if (state.edit) { state.edit.dirty = true; $('#savebar')?.classList.add('on') } }
function settingsDirty() { $('#dirty')?.classList.toggle('on', JSON.stringify(SETTINGS) !== JSON.stringify(saved)) }

document.addEventListener('change', (e) => {

document.addEventListener('input', (e) => {

document.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName || '');
  if (e.key === 'Escape') closeMenus();

/* ================================================================== live queue simulation */
function updatePlayer() {
  const p = $('#player');
  if (!p) return;
  const v = VBY[state.player.id];
  p.classList.toggle('playing', state.player.playing);
  const b = $('#pbtn');
  if (b) { b.innerHTML = ic(state.player.playing ? 'pause' : 'play'); b.setAttribute('aria-label', state.player.playing ? 'Pause' : 'Play') }
  const tt = $('#ptime');
  if (tt) tt.textContent = dur(state.player.t);
  const fill = $('#pfill');
  if (fill && v.dur) fill.style.width = `${(state.player.t / v.dur) * 100}%`;
}
function updateLive() {
  document.querySelectorAll('[data-pj]').forEach((el) => {
    const j = JOBS.find((x) => String(x.id) === el.dataset.pj);
    if (!j || j.phase !== 'downloading') return;
    const k = el.dataset.k;
    if (k === 'w') el.style.width = `${pctN(j)}%`;
    else if (k === 'pct') el.textContent = pct(j);
    else if (k === 'got') el.textContent = bytes(j.got);
    else if (k === 'speed') el.textContent = `${bytes(j.speed)}/s`;
    else if (k === 'eta') el.textContent = etaS(j);
  });
  const sp = document.querySelector('[data-q="speed"]');
  if (sp) sp.textContent = bytes(JOBS.filter((j) => j.status === 'running' && j.kind === 'download' && j.phase === 'downloading').reduce((s, j) => s + j.speed, 0));
}
function startNext() {
  let running = JOBS.filter((j) => j.status === 'running' && j.kind === 'download').length;
  while (running < SETTINGS.conc) {
    const j = JOBS.find((x) => x.status === 'queued' && x.kind === 'download' && !waitingJob(x));
    if (!j) break;
    const v = VBY[j.vid];
    Object.assign(j, { status: 'running', phase: 'downloading', got: 0, total: j.est || 400e6, speed: 6.5e6 + Math.random() * 4e6, started: now(), q: v.q || '1080p' });
    v.st = 'downloading';
    COUNTS.queued--; COUNTS.running++;
    LIBC.queued--; LIBC.downloading++;
    running++;
  }
}
function complete(j) {
  const v = VBY[j.vid];
  j.status = 'completed';
  j.finished = now();
  j.took = Math.round((j.finished - j.started) / 1000);
  j.size = j.total;
  j.q ||= '1080p';
  Object.assign(v, { st: 'archived', arch: now(), size: j.total, q: j.q, w: v.type === 'short' ? 1080 : 1920, h: v.type === 'short' ? 1920 : 1080 });
  v.subs = ['en'];
  if (v.ch && CH[v.ch]) CH[v.ch].archived++;
  COUNTS.running--; COUNTS.completed++;
  LIBC.downloading--; LIBC.archived++;
  const s = v.ch && CH[v.ch]?.sub ? SBY[CH[v.ch].sub] : null;
  if (s && s.counts.queued > 0) { s.counts.queued--; s.counts.archived++ }
  toast(`Archived “${v.t}”`);
}
function completeCheck(j) {
  const s = SBY[j.sub];
  j.status = 'completed';
  j.finished = now();
  j.took = Math.round((j.finished - j.started) / 1000);
  j.r = { listed: 20, new: 0, queued: 0, removed: 0 };
  s.checking = false;
  s.last = { status: 'completed', at: now(), r: j.r };
  s.next = new Date(now().getTime() + s.every * 3600000);
  COUNTS.running--; COUNTS.completed++;
}
let ticks = 0;
setInterval(() => {
  ticks++;
  let changed = false;
  for (const j of JOBS) {
    if (j.status !== 'running') continue;
    if (j.kind === 'download' && j.phase === 'downloading') {
      j.speed = Math.max(4.8e6, Math.min(12.5e6, j.speed + (Math.random() - 0.5) * 1.4e6));
      j.got = Math.min(j.total, j.got + j.speed);
      if (j.got >= j.total) { j.phase = 'processing'; j.procLeft = 5; changed = true }
    } else if (j.kind === 'download' && j.phase === 'processing') {
      if (--j.procLeft <= 0) { complete(j); changed = true }
    } else if (j.kind === 'check') {
      if (--j.left <= 0) { completeCheck(j); changed = true }
    }
  }
  if (changed) {
    startNext();
    updateNavCounts();
    const r = route().name;
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName || '');
    if (!typing && !document.querySelector('.menu.open') && ['library', 'queue', 'video', 'sub', 'subs'].includes(r)) {
      if (r === 'library') rerenderLib(); else render(true);
    }
  } else updateLive();
  if (state.player.playing) {
    const v = VBY[state.player.id];
    if (v && v.dur) { state.player.t = Math.min(v.dur, state.player.t + 1); if (state.player.t >= v.dur) state.player.playing = false; updatePlayer() }
  }
}, 1000);

render();
})();
</script>
