name: Checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: uv run ruff check app main.py tests
      - run: uv run ruff format --check app main.py tests
      - run: npm run check
      - run: npm run build
      - run: uv run pytest
